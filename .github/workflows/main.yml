name: High Quality Chinese Video to Burmese TikTok

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Chinese video URL (TikTok/Douyin)'
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache models
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/faster_whisper
          key: model-cache-v3

      - name: Install system deps & Local Pyidaungsu Font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig
          sudo mkdir -p /usr/share/fonts/truetype/pyidaungsu
          sudo cp Pyidaungsu.ttf /usr/share/fonts/truetype/pyidaungsu/
          sudo fc-cache -fv

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download video
        run: |
          mkdir -p input output
          COOKIE_ARG=""
          if [ -f "cookies.txt" ]; then
            COOKIE_ARG="--cookies cookies.txt"
            echo "🍪 cookies.txt found! Using authenticated download."
          fi
          # ပိုမိုကောင်းမွန်သော Chrome Browser အသွင်ယူပြီး ဒေါင်းလုဒ်ဆွဲမည့်စနစ်
          yt-dlp --no-check-certificate \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            $COOKIE_ARG \
            --extractor-args "tiktok:api_hostname=api16-normal-c-useast1a.tiktokv.com" \
            -o "input/video.mp4" \
            "${{ inputs.video_url }}"

     
      - name: High-Quality Transcribe (Chinese)
        run: python transcribe.py

      - name: High-Quality Translate (Chinese → Burmese)
        run: python translate.py

      - name: Burn subtitles
        run: python burn.py

      - name: Fast Resize to TikTok Layout
        run: python resize.py

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: tiktok_video
          path: output/tiktok_final.mp4
