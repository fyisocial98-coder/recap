name: High Quality Video to Burmese TikTok (Via Direct Link)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'ကိုယ်တိုင်ဒေါင်းထားသည့် ဗီဒီယို၏ Direct Link ကို ထည့်ပါ'
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache models
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/faster_whisper
          key: model-cache-v3

      - name: Install system deps & Local Pyidaungsu Font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig curl
          sudo mkdir -p /usr/share/fonts/truetype/pyidaungsu
          sudo cp Pyidaungsu.ttf /usr/share/fonts/truetype/pyidaungsu/
          sudo fc-cache -fv

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Video from Link
        run: |
          mkdir -p input output
          # လူကိုယ်တိုင်တင်ထားသော Cloud Link မှ ဗီဒီယိုကို တိုက်ရိုက်ဆွဲယူခြင်း
          curl -L -o input/video.mp4 "${{ inputs.video_url }}"
          
          if [ -s "input/video.mp4" ]; then
            echo "✅ Video downloaded successfully from user link."
          else
            echo "❌ Error: ဗီဒီယိုကို ဒေါင်းလုဒ်ဆွဲ၍မရပါ။ လင့်ခ်မှားနေခြင်း သို့မဟုတ် လင့်ခ်သက်တမ်းကုန်နေခြင်း ဖြစ်နိုင်ပါသည်။"
            exit 1
          fi

      - name: High-Quality Transcribe (Chinese)
        run: python transcribe.py

      - name: High-Quality Translate (Chinese → Burmese)
        run: python translate.py

      - name: Burn subtitles
        run: python burn.py

      - name: Fast Resize to TikTok Layout
        run: python resize.py

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: tiktok_video
          path: output/tiktok_final.mp4
