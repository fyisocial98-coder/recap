name: Free Chinese Video to Burmese TikTok

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Chinese video URL'
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache models
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/faster_whisper
          key: model-cache-v1
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -fv
      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download video
        run: |
          mkdir -p input output
          yt-dlp -f "best[ext=mp4]" -o "input/video.mp4" "${{ inputs.video_url }}"
      - name: Transcribe (Chinese)
        run: python transcribe.py
      - name: Translate (Chinese → Burmese)
        run: python translate.py
      - name: Burn subtitles
        run: python burn.py
      - name: Resize to TikTok
        run: python resize.py
      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: tiktok_video
          path: output/tiktok_final.mp4
